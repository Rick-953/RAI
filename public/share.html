<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <script src="locale.js?v=20261029-entry-i18n"></script>
  <title data-entry-i18n="sharePageTitle">RAI · 分享的对话</title>
  <link rel="stylesheet" href="secure-sharing.css">
  <link rel="stylesheet" href="entry-locale.css?v=20261029-entry-i18n">
</head>
<body class="rai-share-page">
  <main>
    <header><span class="rai-share-brand">RAI</span><p data-entry-i18n="shareSubtitle">分享的对话 · 只读快照</p></header>
    <div class="entry-language">
      <label for="entryLanguage" data-entry-i18n="language">界面语言</label>
      <select id="entryLanguage">
        <option value="auto" data-entry-i18n="auto">跟随浏览器</option>
        <option value="zh-CN" lang="zh-CN">简体中文</option>
        <option value="en" lang="en">English</option>
        <option value="zh-TW" lang="zh-TW">繁體中文</option>
      </select>
    </div>
    <h1 id="shareTitle">正在读取对话…</h1>
    <p id="shareStatus" role="status"></p>
    <nav><a id="openCxRai" hidden data-entry-i18n="openNative">在 CX RAI 中打开</a><a href="./" data-entry-i18n="backToWeb">返回 RAI Web</a></nav>
    <section id="sharedMessages" aria-label="对话内容" data-entry-i18n-aria-label="conversation"></section>
    <footer data-entry-i18n="shareNotice">此页面由用户分享，内容不代表 RAI 官方观点。不要执行来源不明的命令或泄露个人信息。</footer>
  </main>
  <script src="entry-i18n.js?v=20261029-entry-i18n" defer></script>
  <script src="share.js?v=20261029-entry-i18n" defer></script>
</body>
</html>
