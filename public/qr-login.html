<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex,nofollow">
  <script src="locale.js?v=20261030-qr-locale"></script>
  <title>RAI · 确认登录</title>
  <link rel="stylesheet" href="secure-sharing.css?v=20260930-qr-refresh-r1">
  <link rel="stylesheet" href="entry-locale.css?v=20261029-entry-i18n">
</head>
<body class="rai-share-page">
  <main>
    <div class="entry-language">
      <label for="entryLanguage" data-entry-i18n="language">界面语言</label>
      <select id="entryLanguage">
        <option value="auto" data-entry-i18n="auto">跟随浏览器</option>
        <option value="zh-CN" lang="zh-CN">简体中文</option>
        <option value="en" lang="en">English</option>
        <option value="zh-TW" lang="zh-TW">繁體中文</option>
      </select>
    </div>
    <h1>确认登录</h1>
    <p id="qrStatus" role="status">正在核对二维码…</p>
    <p id="qrDevice"></p><p id="qrIp"></p><p id="qrLocation"></p><p id="qrCode"></p>
    <p>确认后，该设备将直接登录你的账号。核对码无需输入，只用于核对两台设备是否一致。不要确认别人发来的二维码。IP 位置仅供参考，VPN 或代理可能改变位置。</p>
    <nav><button id="deny" hidden>拒绝</button><button id="approve" hidden>确认登录</button><a href="./">返回 RAI</a></nav>
  </main>
  <script src="entry-i18n.js?v=20261029-entry-i18n" defer></script>
  <script src="qr-approve.js?v=20261030-qr-locale" defer></script>
</body>
</html>
