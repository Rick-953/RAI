[package]
name = "rai-agent"
version = "0.13.1"
description = "RAI Local Agent native messaging host"
authors = ["Rick"]
license = "MIT"
repository = "https://github.com/Rick-953/RAI"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0"
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core", "pkcs8"] }
hex = "0.4"
pkcs8 = { version = "0.10", features = ["pem"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.23"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
wait-timeout = "0.2"
walkdir = "2.5"
webbrowser = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
winreg = "0.55"

[dev-dependencies]
assert_fs = "1.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
