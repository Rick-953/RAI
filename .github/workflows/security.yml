name: Security gates

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '23 18 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    # GitHub's explicit bash shell enables both `-e` and `-o pipefail`.
    # This keeps audit/build pipelines from succeeding when their producer fails.
    shell: bash

env:
  # Keep the release gate on the same Node/npm major used by production.
  NODE_VERSION: 24.16.0
  NPM_VERSION: 11.13.0

jobs:
  formal-tests:
    name: Formal regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag contract
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected_tag="v$(node -p "require('./package.json').version")"
          if [[ "$RELEASE_TAG" != "$expected_tag" ]]; then
            echo "release tag must equal package version: expected $expected_tag" >&2
            exit 1
          fi
          node -e "const p=require('./package.json'); const l=require('./package-lock.json'); if (l.version !== p.version || l.packages?.['']?.version !== p.version) { throw new Error('package-lock version must equal package version'); }"

          release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$release_commit" refs/remotes/origin/main; then
            echo "release tag must point to a commit already present on main" >&2
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Verify release toolchain versions
        run: |
          test "$(node --version)" = "v${NODE_VERSION}"
          test "$(npm --version)" = "$NPM_VERSION"
      - name: Install Tauri check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install locked dependencies
        run: npm ci
      - name: Validate isolated harness syntax
        run: node --check scripts/security-smoke-harness.js
      - name: Run formal audit suite
        run: npm run test:formal-audit

  isolated-security-smoke:
    name: Isolated runtime security smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run smoke test in an ephemeral runtime
        run: node scripts/security-smoke-harness.js

  dependency-audit:
    name: Dependency audit and SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Prepare report directory
        run: mkdir -p security-artifacts
      - name: Install locked dependencies
        run: npm ci
      - name: Generate CycloneDX SBOM
        run: |
          npm sbom --sbom-format=cyclonedx > security-artifacts/rai-sbom.cdx.json
          node -e "JSON.parse(require('fs').readFileSync('security-artifacts/rai-sbom.cdx.json', 'utf8'))"
      - name: Verify vendored browser dependencies and generate their SBOM
        run: npm run sbom:vendored-web
      - name: Verify vendored bytes against pinned official npm tarballs
        run: npm run test:vendor-provenance
      - name: Audit production dependencies
        run: npm audit --audit-level=low --json | tee security-artifacts/npm-audit.json
      - name: Record report checksums
        if: always()
        run: |
          find security-artifacts -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > security-artifacts/SHA256SUMS
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

  osv-audit:
    name: OSV lockfile audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Generate vendored browser SBOM before OSV scan
        run: npm run sbom:vendored-web
      - name: Scan lockfiles and vendored browser SBOM
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --recursive
            ./
      - name: Enforce OSV result and produce SARIF
        uses: google/osv-scanner-action/osv-reporter-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --output=osv-results.sarif
            --new=osv-results.json
            --gh-annotations=true
            --fail-on-vuln=true
      - name: Upload OSV result
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-results
          path: |
            osv-results.json
            osv-results.sarif
            security-artifacts/rai-vendored-web-sbom.cdx.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish OSV SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          sarif_file: osv-results.sarif

  rustsec-audit:
    name: RustSec Cargo audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # Mirrors the documented, expiring upstream exceptions in
          # src-tauri/osv-scanner.toml. OSV expiry keeps this list from becoming permanent.
          ignore: RUSTSEC-2024-0370,RUSTSEC-2024-0411,RUSTSEC-2024-0412,RUSTSEC-2024-0413,RUSTSEC-2024-0414,RUSTSEC-2024-0415,RUSTSEC-2024-0416,RUSTSEC-2024-0417,RUSTSEC-2024-0418,RUSTSEC-2024-0419,RUSTSEC-2024-0420,RUSTSEC-2024-0429,RUSTSEC-2025-0075,RUSTSEC-2025-0080,RUSTSEC-2025-0081,RUSTSEC-2025-0098,RUSTSEC-2025-0100

  rustsec-local-agent:
    name: RustSec Local Agent audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      checks: write
      contents: read
      issues: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit Local Agent dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rai-agent

  codeql:
    name: CodeQL JavaScript analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: javascript-typescript
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:javascript-typescript

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  security-gate-summary:
    name: Security gate summary
    if: always()
    needs: [formal-tests, isolated-security-smoke, dependency-audit, osv-audit, rustsec-audit, rustsec-local-agent, codeql, secret-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every security gate to succeed
        env:
          FORMAL_TESTS: ${{ needs.formal-tests.result }}
          ISOLATED_SECURITY_SMOKE: ${{ needs.isolated-security-smoke.result }}
          DEPENDENCY_AUDIT: ${{ needs.dependency-audit.result }}
          OSV_AUDIT: ${{ needs.osv-audit.result }}
          RUSTSEC_AUDIT: ${{ needs.rustsec-audit.result }}
          RUSTSEC_LOCAL_AGENT: ${{ needs.rustsec-local-agent.result }}
          CODEQL: ${{ needs.codeql.result }}
          SECRET_SCAN: ${{ needs.secret-scan.result }}
        run: |
          for result in \
            "$FORMAL_TESTS" \
            "$ISOLATED_SECURITY_SMOKE" \
            "$DEPENDENCY_AUDIT" \
            "$OSV_AUDIT" \
            "$RUSTSEC_AUDIT" \
            "$RUSTSEC_LOCAL_AGENT" \
            "$CODEQL" \
            "$SECRET_SCAN"; do
            if [[ "$result" != "success" ]]; then
              echo "one or more required security gates did not succeed" >&2
              exit 1
            fi
          done

  package-web-release:
    name: Package deterministic Web release artifact
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: security-gate-summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build deterministic allowlisted archive
        run: |
          mkdir -p release-artifacts
          version="$(node -p "require('./package.json').version")"
          release_paths=(
            .env.example LICENSE README.md README.zh-CN.md docs
            agent lib workers public scripts server.js user-session-token.js package.json package-lock.json
          )
          for release_path in "${release_paths[@]}"; do
            git ls-files --error-unmatch "$release_path" >/dev/null
          done
          git archive --format=tar --prefix="rai-v${version}/" HEAD -- \
            "${release_paths[@]}" \
            | gzip -n > "release-artifacts/rai-web-v${version}.tar.gz"
          gzip -t "release-artifacts/rai-web-v${version}.tar.gz"
          tar -tzf "release-artifacts/rai-web-v${version}.tar.gz" >/dev/null
          (
            cd release-artifacts
            sha256sum "rai-web-v${version}.tar.gz" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload Web release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rai-web-release
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  rebuild-web-release:
    name: Independently rebuild Web release artifact
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: security-gate-summary
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository into a second clean runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Independently build deterministic allowlisted archive
        run: |
          mkdir -p release-artifacts
          version="$(node -p "require('./package.json').version")"
          release_paths=(
            .env.example LICENSE README.md README.zh-CN.md docs
            agent lib workers public scripts server.js user-session-token.js package.json package-lock.json
          )
          for release_path in "${release_paths[@]}"; do
            git ls-files --error-unmatch "$release_path" >/dev/null
          done
          git archive --format=tar --prefix="rai-v${version}/" HEAD -- \
            "${release_paths[@]}" \
            | gzip -n > "release-artifacts/rai-web-v${version}.tar.gz"
          gzip -t "release-artifacts/rai-web-v${version}.tar.gz"
          tar -tzf "release-artifacts/rai-web-v${version}.tar.gz" >/dev/null
          (
            cd release-artifacts
            sha256sum "rai-web-v${version}.tar.gz" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - name: Upload independent Web release rebuild
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rai-web-release-rebuild
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 30

  verify-reproducible-web-release:
    name: Verify independent Web release reproduction
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: [package-web-release, rebuild-web-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download primary Web release build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rai-web-release
          path: primary-release
      - name: Download independent Web release rebuild
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rai-web-release-rebuild
          path: rebuilt-release
      - name: Require byte-identical archives and checksums
        run: |
          mapfile -t primary_archives < <(find primary-release -maxdepth 1 -type f -name 'rai-web-*.tar.gz' -print)
          mapfile -t rebuilt_archives < <(find rebuilt-release -maxdepth 1 -type f -name 'rai-web-*.tar.gz' -print)
          if [[ "${#primary_archives[@]}" != "1" || "${#rebuilt_archives[@]}" != "1" ]]; then
            echo "each independent build must contain exactly one Web release archive" >&2
            exit 1
          fi
          if [[ "$(basename "${primary_archives[0]}")" != "$(basename "${rebuilt_archives[0]}")" ]]; then
            echo "independent build archive names differ" >&2
            exit 1
          fi
          (
            cd primary-release
            sha256sum -c SHA256SUMS
          )
          (
            cd rebuilt-release
            sha256sum -c SHA256SUMS
          )
          cmp -- "${primary_archives[0]}" "${rebuilt_archives[0]}"
          cmp -- primary-release/SHA256SUMS rebuilt-release/SHA256SUMS
          mkdir -p verified-release-artifacts
          cp -- "${primary_archives[0]}" verified-release-artifacts/
          cp -- primary-release/SHA256SUMS verified-release-artifacts/
          (
            cd verified-release-artifacts
            sha256sum -c SHA256SUMS
          )
      - name: Upload only the independently verified Web release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rai-web-release-verified
          path: verified-release-artifacts/
          if-no-files-found: error
          retention-days: 30

  attest-web-release-provenance:
    name: Attest Web release provenance
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: verify-reproducible-web-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download Web release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rai-web-release-verified
          path: release-artifacts
      - name: Attest Web release artifact
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: release-artifacts/rai-web-*.tar.gz

  attest-sbom-provenance:
    name: Attest Web release SBOM
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: verify-reproducible-web-release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download Web release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rai-web-release-verified
          path: release-artifacts
      - name: Download security reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: security-reports
          path: security-artifacts
      - name: Attest npm SBOM against the Web release artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-artifacts/rai-web-*.tar.gz
          sbom-path: security-artifacts/rai-sbom.cdx.json
      - name: Attest vendored browser SBOM against the Web release artifact
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: release-artifacts/rai-web-*.tar.gz
          sbom-path: security-artifacts/rai-vendored-web-sbom.cdx.json

  stage-github-release:
    name: Stage verified GitHub Release
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [attest-web-release-provenance, attest-sbom-provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified Web release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rai-web-release-verified
          path: release-artifacts
      - name: Verify release artifact checksum
        run: |
          cd release-artifacts
          sha256sum -c SHA256SUMS
      - name: Create a draft release and upload the attested artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          resolve_remote_tag_commit() {
            local object_json object_type object_sha
            object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
            object_type="$(jq -r '.object.type' <<<"$object_json")"
            object_sha="$(jq -r '.object.sha' <<<"$object_json")"
            for _depth in 1 2 3 4 5; do
              if [[ "$object_type" == "commit" ]]; then
                printf '%s\n' "$object_sha"
                return 0
              fi
              if [[ "$object_type" != "tag" ]]; then
                echo "release ref resolved to unsupported object type" >&2
                return 1
              fi
              object_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${object_sha}")"
              object_type="$(jq -r '.object.type' <<<"$object_json")"
              object_sha="$(jq -r '.object.sha' <<<"$object_json")"
            done
            echo "release tag nesting exceeds the verification limit" >&2
            return 1
          }

          require_tag_bound_to_workflow_commit() {
            local remote_commit
            remote_commit="$(resolve_remote_tag_commit)"
            if [[ "$remote_commit" != "$RELEASE_COMMIT" ]]; then
              echo "remote release tag no longer points to the attested workflow commit" >&2
              return 1
            fi
          }

          find_release_by_tag() {
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              | jq -c --arg tag "$RELEASE_TAG" 'map(select(.tag_name == $tag))[0] // empty'
          }

          archive="$(find release-artifacts -maxdepth 1 -type f -name 'rai-web-*.tar.gz' -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "verified release archive is missing" >&2
            exit 1
          fi

          require_tag_bound_to_workflow_commit

          release_json="$(find_release_by_tag)"
          if [[ -n "$release_json" ]]; then
            draft="$(jq -r .draft <<<"$release_json")"
            if [[ "$draft" != "true" ]]; then
              echo "refusing to overwrite assets on a published release" >&2
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --target "$RELEASE_COMMIT" \
              --title "RAI $RELEASE_TAG" \
              --generate-notes \
              --draft
            release_json=""
            for attempt in $(seq 1 15); do
              release_json="$(find_release_by_tag)"
              if [[ -n "$release_json" ]]; then break; fi
              sleep 2
            done
            if [[ -z "$release_json" ]]; then
              echo "new draft release could not be resolved by tag" >&2
              exit 1
            fi
          fi
          release_id="$(jq -r .id <<<"$release_json")"

          gh release upload "$RELEASE_TAG" \
            "$archive" \
            release-artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          expected_digest="sha256:$(awk 'NR == 1 { print $1 }' release-artifacts/SHA256SUMS)"
          expected_checksums_digest="sha256:$(sha256sum release-artifacts/SHA256SUMS | awk '{ print $1 }')"
          asset_name="$(basename "$archive")"
          for attempt in 1 2 3 4 5; do
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
            actual_digest="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")"
            actual_checksums_digest="$(jq -r '.assets[] | select(.name == "SHA256SUMS") | .digest' <<<"$release_json")"
            asset_count="$(jq -r '.assets | length' <<<"$release_json")"
            if [[ "$asset_count" -ge 2 \
              && "$actual_digest" == "$expected_digest" \
              && "$actual_checksums_digest" == "$expected_checksums_digest" ]]; then
              break
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "draft release must contain the two verified Web assets with matching digests" >&2
              exit 1
            fi
            sleep 2
          done
          require_tag_bound_to_workflow_commit
