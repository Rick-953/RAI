version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    rebase-strategy: auto
    # Keep major npm upgrades individually reviewable; do not defer security fixes.
    groups:
      npm-minor-patch:
        patterns: ['*']
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:15'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    rebase-strategy: auto
    # Related init/analyze/upload and scanner/reporter actions must move together.
    groups:
      github-actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: Asia/Singapore
    open-pull-requests-limit: 5
    rebase-strategy: auto
    groups:
      tauri-dependencies:
        patterns: ['tauri*']
      cargo-minor-patch:
        patterns: ['*']
        exclude-patterns: ['tauri*']
        update-types: [minor, patch]
      cargo-security:
        applies-to: security-updates
        patterns: ['*']
