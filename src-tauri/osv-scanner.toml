# Time-bounded exceptions inherited from Tauri 2.11.2's Linux GTK3/WebKitGTK
# dependency graph. Tauri 2.11.2 is the current upstream release and its own
# release audit reports the same advisories. RAI's Rust layer does not directly
# use GTK iterators or any of the listed crates. Re-evaluate on every Tauri
# update and no later than the date below; do not add unrelated exceptions here.

